services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.9.24
    command: gateway run
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_UID=1000
      - HERMES_GID=1000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "test -d /opt/data/skills || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:0.51.92
    depends_on:
      - hermes-agent
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/opt/data/webui
      - WANTED_UID=1000
      - WANTED_GID=1000
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
    volumes:
      - data:/opt/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
    external: true
    name: brifii_noborrar_hermes-agent-brifii_data
